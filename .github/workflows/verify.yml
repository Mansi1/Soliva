# defuss-vae CI: the same bootstrap and verbs as local development, so CI cannot drift from `make verify`.
name: verify
on:
  push:
  pull_request:
jobs:
  verify:
    # e2e rendert WebGL 2: ubuntu-latest hat keine GPU, SwiftShader braucht dort Sekunden je Bild und der
    # Rauchtest läuft in Zeitüberschreitungen. Die macOS-Runner (arm64) haben eine Metal-GPU und Chrome am
    # Standardort von tools/ui/browser.mjs.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # Tests importieren .ts direkt (Node >= 22.6), Vite 8 braucht ebenfalls ein neues Node.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # setup installs a missing uv/bun with the official installers; later steps get their dirs on PATH.
      - run: make setup && printf '%s\n' "$HOME/.local/bin" "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - run: make verify
