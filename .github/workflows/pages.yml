# Baut das Spiel bei jedem Push auf main und veröffentlicht dist/ auf GitHub Pages.
# Einmalig im Repo einstellen: Settings → Pages → Source: "GitHub Actions".
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deployment zugleich; ein laufendes wird nicht abgebrochen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # npm test importiert .ts direkt (Node >= 22.6), Vite 8 braucht ebenfalls ein neues Node.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: pages
        uses: actions/configure-pages@v6
      # Dieselben Befehle wie lokal (Makefile); setup installiert ein fehlendes bun.
      - run: make setup && echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - run: make test
      # Projektseite liegt unter /<repo>/ (base_path ohne Schrägstrich am Ende), bei eigener Domain unter /.
      - run: bun run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
