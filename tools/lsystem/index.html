<!doctype html>
<!-- Spielwiese für L-System-Bäume (lsystem.ts). Aufruf: npm run dev, dann
     http://localhost:5173/tools/lsystem/ öffnen. -->
<html lang="de">
<head>
<meta charset="utf-8">
<title>L-System-Bäume</title>
<style>
  :root { color-scheme: dark; --bg: #1b1d1a; --panel: #25282a; --line: #3a3f41; --text: #e4e2da; --muted: #9a9c94; --error: #e87c6a; }
  * { box-sizing: border-box; }
  body { margin: 0; display: flex; height: 100vh; background: var(--bg); color: var(--text); font: 13px system-ui, sans-serif; }
  aside { width: 340px; flex: none; padding: 12px; overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line); }
  main { flex: 1; position: relative; min-width: 0; }
  canvas { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  label { display: block; margin: 10px 0 3px; color: var(--muted); }
  input, select, textarea, button { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 5px; font: inherit; }
  textarea { height: 150px; font-family: ui-monospace, monospace; font-size: 12px; white-space: pre; }
  input[type=range] { padding: 0; }
  button { margin-top: 12px; cursor: pointer; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 8px; }
  #stats { position: absolute; left: 10px; bottom: 8px; color: var(--muted); }
  #error { color: var(--error); white-space: pre-wrap; margin-top: 8px; }
  details { margin-top: 10px; color: var(--muted); line-height: 1.5; }
  code { color: var(--text); }
</style>
</head>
<body>
<aside>
  <label for="preset">Beispiel · <a href="./gallery.html" style="color: inherit">Galerie</a></label><select id="preset"></select>
  <label for="axiom">Axiom</label><input id="axiom">
  <label for="rules">Regeln</label><textarea id="rules" spellcheck="false"></textarea>
  <div class="grid">
    <div><label for="iterations">Schritte <span id="iterations-value"></span></label><input id="iterations" type="range" min="0" max="20" step="1"></div>
    <div><label for="angle">Winkel <span id="angle-value"></span>°</label><input id="angle" type="range" min="1" max="90" step="0.5"></div>
    <div><label for="tropism">Tropismus <span id="tropism-value"></span></label><input id="tropism" type="range" min="-0.5" max="0.6" step="0.01"></div>
    <div><label for="jitter">Streuung <span id="jitter-value"></span></label><input id="jitter" type="range" min="0" max="0.6" step="0.01"></div>
    <div><label for="wander">Krümmung (°/m) <span id="wander-value"></span></label><input id="wander" type="range" min="0" max="15" step="0.5"></div>
    <div><label for="lengthFactor">Längenfaktor <span id="lengthFactor-value"></span></label><input id="lengthFactor" type="range" min="0.5" max="1.1" step="0.01"></div>
    <div><label for="leafSize">Laubgröße <span id="leafSize-value"></span></label><input id="leafSize" type="range" min="0" max="2" step="0.05"></div>
    <div><label for="sides">Ecken am Stamm <span id="sides-value"></span></label><input id="sides" type="range" min="3" max="16" step="1"></div>
    <div><label for="seed">Seed</label><input id="seed" type="number" min="1"></div>
    <div><label for="leaves">Laub-Zeichen</label><input id="leaves"></div>
    <div><label for="rootSeed">Wurzel-Seed</label><input id="rootSeed" type="number" min="1" placeholder="wie Seed"></div>
    <div><label>&nbsp;</label><button id="reroot">Neue Wurzeln</button></div>
  </div>
  <label for="leafMode">Blätter</label>
  <select id="leafMode">
    <option value="texture">Foto als Textur</option>
    <option value="shape">Form nach dem Foto (einfarbig)</option>
  </select>
  <label for="cards">Anordnung</label>
  <select id="cards">
    <option value="1">Blattebenen (Zweig mit mehreren Blättern)</option>
    <option value="0">Einzelblätter</option>
  </select>
  <label style="display: flex; gap: 6px; align-items: center"><input id="wire" type="checkbox" style="width: auto; margin: 0"> Gitter</label>
  <label style="display: flex; gap: 6px; align-items: center"><input id="stump" type="checkbox" style="width: auto; margin: 0"> Nur Stumpf (wie im Spiel nach dem Fällen)</label>
  <button id="reseed">Neuer Seed</button>
  <button id="download">OBJ + MTL herunterladen</button>
  <button id="download-glb">Für Blender herunterladen (.glb)</button>
  <div id="error"></div>
  <details><summary>Zeichen</summary>
    <code>F</code> Ast, <code>f</code> bewegen, <code>+ -</code> gieren, <code>&amp; ^</code> nicken,
    <code>\ /</code> rollen, <code>|</code> umdrehen, <code>[ ]</code> verzweigen,
    <code>"</code> Länge × Faktor, <code>L</code> Laub. Argumente in Klammern: <code>+(30)</code>, <code>F(2)</code>.
    Regeln: <code>A -&gt; F[+A]</code>, zufällig mit Gewicht: <code>A 0.3 -&gt; FA</code>.
    Ziehen dreht, Mausrad zoomt.
  </details>
</aside>
<main><canvas id="view"></canvas><div id="stats"></div></main>
<script type="module" src="./viewer.ts"></script>
</body>
</html>
